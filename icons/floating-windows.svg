<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14">
  <style>
    .stroke { fill: none; stroke: #374151; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .fill-dark { fill: #374151; }
  </style>

  <!-- Retângulo vertical (janela principal) -->
  <rect x="3" y="3" width="10" height="14" rx="1.5" class="stroke"/>

  <!-- 3 pontinhos no topo do retângulo vertical -->
  <circle cx="5.5" cy="5.8" r="0.6" class="fill-dark"/>
  <circle cx="7.5" cy="5.8" r="0.6" class="fill-dark"/>
  <circle cx="9.5" cy="5.8" r="0.6" class="fill-dark"/>

  <!-- Retângulo horizontal (janela sobreposta) -->
  <rect x="8" y="8" width="13" height="10" rx="1.5" class="stroke"/>

  <!-- Linha separadora do retângulo horizontal -->
  <line x1="8" y1="11.5" x2="21" y2="11.5" class="stroke" style="stroke-width: 1; opacity: 0.3;"/>

  <!-- Seta na diagonal saindo do retângulo vertical -->
  <line x1="14" y1="7" x2="20" y2="2" class="stroke"/>
  <polyline points="17,2 21,1 20,5" class="stroke"/>
</svg>