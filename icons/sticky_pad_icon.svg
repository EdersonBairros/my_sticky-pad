<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007aff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856d6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#007aff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="56" y="56" width="400" height="400" rx="96" ry="96" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Sticky note body -->
  <rect x="156" y="136" width="200" height="200" rx="20" ry="20" fill="#ffffff" opacity="0.95"/>

  <!-- Folded corner -->
  <path d="M 316 136 L 356 136 L 356 176 Z" fill="#e5e5ea"/>

  <!-- Lines on the note -->
  <rect x="176" y="186" width="120" height="10" rx="5" fill="#c7c7cc"/>
  <rect x="176" y="216" width="160" height="10" rx="5" fill="#c7c7cc"/>
  <rect x="176" y="246" width="100" height="10" rx="5" fill="#c7c7cc"/>
  <rect x="176" y="276" width="140" height="10" rx="5" fill="#c7c7cc"/>

  <!-- Pin -->
  <circle cx="256" cy="116" r="18" fill="#ff3b30"/>
  <circle cx="256" cy="116" r="8" fill="#ff6b6b"/>
</svg>