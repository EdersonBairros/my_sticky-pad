<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sticky-pad Lembretes</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="popup.css">
    <!-- Aplica o tema antes do primeiro paint (evita flash). -->
    <script src="src/ui/theme-init.js"></script>
</head>

<body>
    <div class="container">
        <div class="resize-handle resize-handle-right" data-resize="right"></div>
        <div class="resize-handle resize-handle-bottom" data-resize="bottom"></div>
        <div class="resize-handle resize-handle-corner" data-resize="se"></div>
        <div class="resize-handle resize-handle-corner-ne" data-resize="ne"></div>
        <div class="resize-handle resize-handle-left" data-resize="left"></div>
        <div class="header">
            <button id="backBtn" class="back-btn" title="Voltar para a tela principal" aria-label="Voltar"><span class="back-arrow" aria-hidden="true">←</span> Voltar</button>
            <img id="headerLogo" class="header-logo" src="icons/sticky_pad_icon.svg" alt="" aria-hidden="true">
            <h1 id="headerTitle">Sticky-Pad</h1>
            <div id="headerActions" class="header-actions">
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
                    <span class="tt-knob"><span class="tt-sun">☀️</span><span class="tt-moon">🌙</span></span>
                </button>
                <button id="addNoteBtn" class="add-btn" title="Adicionar novo lembrete">+</button>
                <div class="options-wrap">
                    <button id="optionsBtn" class="options-btn" title="Mais opções">⋮</button>
                    <div id="optionsMenu" class="options-menu">
                        <button id="exportMenuItem" class="options-menu-item" data-action="export">📤 Exportar
                            notas</button>
                        <button id="importMenuItem" class="options-menu-item" data-action="import">📥 Importar
                            notas</button>
                        <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;">
                    </div>
                </div>
            </div>
        </div>
        <div id="notesContainer" class="notes-container">
            <!-- Os lembretes serão inseridos aqui dinamicamente -->
        </div>
        <div class="footer">
            <span id="noteCount" class="note-count">0 lembretes</span>
            <div class="search-wrap">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar notas ou Categorias..." maxlength="30" size="30" autocomplete="off">
                <button id="searchClearBtn" class="search-clear" title="Limpar busca" aria-label="Limpar busca">✕</button>
            </div>
            <button id="archiveBoxBtn" class="archive-box-btn" title="Notas arquivadas" aria-label="Notas arquivadas">🗃️</button>
            <button id="clearAllBtn" class="clear-btn" title="Limpar todos os lembretes">🗑️ Limpar tudo</button>
        </div>
    </div>
    <script src="src/core/constants.js"></script>
    <script src="src/utils/date.js"></script>
    <script src="src/utils/color.js"></script>
    <script src="src/utils/dom.js"></script>
    <script src="src/utils/storage.js"></script>
    <script src="src/data/emojis.js"></script>
    <script src="src/models/note.js"></script>
    <script src="src/services/storage.service.js"></script>
    <script src="src/services/export.service.js"></script>
    <script src="src/services/category.service.js"></script>
    <script src="src/ui/notifications.js"></script>
    <script src="src/ui/resize.js"></script>
    <script src="src/ui/editor.js"></script>
    <script src="src/ui/emoji-picker.js"></script>
    <script src="src/ui/color-picker.js"></script>
    <script src="src/ui/category-picker.js"></script>
    <script src="src/ui/notes.renderer.js"></script>
    <script src="src/ui/search.js"></script>
    <script src="src/ui/views.js"></script>
    <script src="src/ui/theme.js"></script>
    <script src="src/ui/options-menu.js"></script>
    <script src="src/core/note.controller.js"></script>
    <script src="src/core/app.js"></script>
    <script src="src/index.js"></script>
</body>

</html>
